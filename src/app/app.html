<mat-toolbar color="primary">
  <span>UMES · Inscripciones</span>

  @if (movil()) {
    <button mat-button [matMenuTriggerFor]="menu">Menú</button>
    <mat-menu #menu="matMenu">
      <a mat-menu-item routerLink="/inicio">Inicio</a>
      <a mat-menu-item routerLink="/estudiantes">Estudiantes</a>
      <a mat-menu-item routerLink="/inscripciones">Inscripciones</a>
      <a mat-menu-item routerLink="/respaldo">Respaldo</a>
    </mat-menu>
  } @else {
    <nav>
      <a mat-button routerLink="/inicio" routerLinkActive="activo">Inicio</a>
      <a mat-button routerLink="/estudiantes" routerLinkActive="activo">Estudiantes</a>
      <a mat-button routerLink="/inscripciones" routerLinkActive="activo">Inscripciones</a>
      <a mat-button routerLink="/respaldo" routerLinkActive="activo">Respaldo</a>
    </nav>
  }
</mat-toolbar>

<main class="contenido">
  <router-outlet />
</main>
